<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="En enkel dagbok för dagliga anteckningar">
    <meta name="theme-color" content="#1a1a1a">
    <title>Min Dagbok</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Dagbok">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dagbok</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Byt tema">
                <span class="theme-icon">☀️</span>
            </button>
        </header>

        <main id="writeView" class="view active">
            <div class="date-navigation">
                <button id="prevDay" class="nav-btn" aria-label="Föregående dag">←</button>
                <input type="date" id="dateInput" aria-label="Välj datum">
                <button id="nextDay" class="nav-btn" aria-label="Nästa dag">→</button>
            </div>

            <div class="date-display" id="dateDisplay">
                Idag
            </div>

            <div class="entry-status" id="entryStatus"></div>

            <textarea
                id="entryText"
                placeholder="Vad hände idag?&#10;&#10;Skriv några rader om din dag..."
                aria-label="Dagboksinlägg"
            ></textarea>

            <div class="save-indicator" id="saveIndicator">
                <span class="saved-text">Sparat</span>
            </div>

            <button id="viewCalendarBtn" class="secondary-btn">
                Visa kalender
            </button>

            <button id="viewListBtn" class="secondary-btn">
                Visa alla inlägg
            </button>
        </main>

        <main id="listView" class="view">
            <div class="list-header">
                <h2>Alla inlägg</h2>
                <button id="backToWriteBtn" class="back-btn">← Tillbaka</button>
            </div>

            <div class="search-section">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Sök i dina inlägg..."
                    aria-label="Sök"
                />
            </div>

            <div class="backup-section">
                <button id="shareBackupBtn" class="backup-btn">
                    Säkerhetskopiera
                </button>
            </div>

            <div id="backupReminder" class="backup-reminder" style="display: none;">
                <div class="reminder-content">
                    <p>🗓️ Ny månad! Glöm inte att säkerhetskopiera din dagbok</p>
                    <button id="reminderBackupBtn" class="reminder-btn">Dela backup nu</button>
                    <button id="dismissReminderBtn" class="dismiss-btn">×</button>
                </div>
            </div>

            <div id="entriesList" class="entries-list">
                <!-- Inlägg kommer här -->
            </div>

            <div id="noEntries" class="no-entries" style="display: none;">
                Inga inlägg ännu. Börja skriva!
            </div>
        </main>

        <main id="readView" class="view">
            <div class="read-header">
                <button id="backToListBtn" class="back-btn">← Tillbaka</button>
                <button id="editEntryBtn" class="edit-btn">Redigera</button>
            </div>

            <div class="read-date" id="readDate">
                <!-- Datum här -->
            </div>

            <div class="read-content" id="readContent">
                <!-- Inläggstext här -->
            </div>
        </main>

        <main id="calendarView" class="view">
            <div class="calendar-header">
                <button id="backToWriteFromCal" class="back-btn">← Tillbaka</button>
                <h2 id="calendarMonthYear">Månad År</h2>
                <div class="month-nav">
                    <button id="prevMonth" class="month-nav-btn">←</button>
                    <button id="nextMonth" class="month-nav-btn">→</button>
                </div>
            </div>

            <div class="calendar-grid">
                <div class="calendar-weekdays">
                    <div class="weekday">Mån</div>
                    <div class="weekday">Tis</div>
                    <div class="weekday">Ons</div>
                    <div class="weekday">Tor</div>
                    <div class="weekday">Fre</div>
                    <div class="weekday">Lör</div>
                    <div class="weekday">Sön</div>
                </div>
                <div class="calendar-days" id="calendarDays">
                    <!-- Dagar kommer här -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        // Registrera Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registrerad'))
                    .catch(err => console.log('Service Worker misslyckades:', err));
            });
        }
    </script>
</body>
</html>
